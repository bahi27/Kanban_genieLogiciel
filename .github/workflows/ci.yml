name: CI

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode clean compile -Dskip.tests=true

  test:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: "**/target/site/jacoco/"

  integration-test:
    needs: test
    runs-on: ubuntu-latest
    # TEMPORAIRE : n'empêche pas le pipeline d'être vert tant que Selenium est instable
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode -pl projest-app -am verify -Dskip.tests=true -Dskip.it=false -Dheadless=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failsafe-reports
          path: "**/target/failsafe-reports/*"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode package -pl projest-app -am -Dskip.tests=true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/bahi27/my_kanban_test:1.0.0